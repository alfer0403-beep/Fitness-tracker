<style>

:root[data-theme="dark"]{--bg:#0d1419;--card:#16202a;--ink:#eef2f4;--mut:#8fa0ab;--line:#24323d;--a:#2fd0b8;--b:#ff8566;--c:#9a8cff;--d:#f5c35a;--glow:rgba(47,208,184,.16);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Manrope","Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:430px;margin:0 auto;padding:16px 16px 140px;min-height:100vh}
h1{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:26px;letter-spacing:-.4px}
h2{font-family:"Fraunces",Georgia,serif;font-weight:600;font-size:18px;margin:22px 0 10px}
.mut{color:var(--mut);font-size:13px}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--c));display:grid;place-items:center;color:#fff;font-weight:700;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-3px)}}
.verse{background:linear-gradient(135deg,var(--a),var(--c));color:#fff;border:0;position:relative;overflow:hidden}
.verse:after{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.18),transparent 30%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.verse>*{position:relative;z-index:1}
.verse p{font-family:"Fraunces",Georgia,serif;font-size:17px;line-height:1.4;transition:opacity .5s}
.verse small{opacity:.85;font-weight:700;display:block;margin-top:8px}
.rings{display:flex;justify-content:space-around;align-items:center;gap:6px}
.ring{position:relative;text-align:center}
.ring svg.r{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .tr{stroke:var(--line)}
.ring .pg{transition:stroke-dashoffset 1.6s cubic-bezier(.3,.8,.2,1)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:19px}
.ring span{font-size:11px;color:var(--mut)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center}
.ic svg,.ico svg{width:20px;height:20px}
.big{font-size:26px;font-weight:800;letter-spacing:-.5px}
.heart{animation:beat 1s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;transition:width 1.4s cubic-bezier(.3,.8,.2,1)}
.stages{display:flex;gap:3px;height:44px;align-items:flex-end}
.stages i{flex:1;border-radius:5px;height:0;transition:height 1s cubic-bezier(.3,.8,.2,1)}
.btn{border:0;border-radius:16px;padding:14px 18px;font:700 15px inherit;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));width:100%;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:30px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer;transition:all .2s}
.chip.on{background:var(--a);border-color:var(--a);color:#fff;transform:scale(1.05)}
.meal{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);animation:pop .4s both}
.meal:first-of-type{border:0}
.ico{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;flex:none}
.meal div:nth-child(2){flex:1}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(398px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:26px;display:flex;justify-content:space-around;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:5}
nav button{background:none;border:0;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10px inherit;font-family:inherit;padding:8px 10px;border-radius:18px;cursor:pointer;transition:all .25s}

nav button.on svg{transform:translateY(-2px) scale(1.15)}
.tip{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.tip:first-of-type{border:0}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s .2s forwards}

.ov{position:fixed;inset:0;background:rgba(5,10,14,.88);z-index:20;display:grid;place-items:center;padding:20px}
.cam{width:min(320px,100%);aspect-ratio:3/4;border-radius:26px;background:radial-gradient(circle at 50% 45%,#d89a4a,#7a4a1c 45%,#2a1a0c);position:relative;overflow:hidden;color:#fff}
.cam .plate{position:absolute;left:14%;top:24%;width:72%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#f4efe4 60%,#cfc6b4);display:grid;place-items:center;font-size:70px}
.scan{position:absolute;left:0;right:0;height:4px;background:var(--a);box-shadow:0 0 22px 6px var(--a);animation:sc 1.6s ease-in-out infinite alternate}
@keyframes sc{from{top:8%}to{top:92%}}
.res{background:var(--card);color:var(--ink);border-radius:22px;padding:16px;width:min(320px,100%);animation:pop .4s both;margin-top:12px}
.corner{position:absolute;width:30px;height:30px;border:3px solid #fff;opacity:.9}
.hide{display:none}
nav button{padding:8px 7px;font-size:9.5px}
.dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--mut);font-size:12px;font-weight:800;transition:all .4s}
.dot.on{background:var(--a);color:#fff;transform:scale(1.1)}
.pray{border-left:4px solid var(--c);padding:6px 12px;margin:12px 0;font-style:italic;font-size:14px;line-height:1.45}
.amen{animation:burst .6s}
.badge{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--line);color:var(--mut);font-weight:800;transition:all .5s}
.badge.on{border-color:var(--d);color:var(--d);background:color-mix(in srgb,var(--d) 14%,transparent);animation:burst .8s}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ph div{position:relative}.ph img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px}
.ph small{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:1px 6px;font-size:10px}
@keyframes burst{40%{transform:scale(1.07)}}
.av{cursor:pointer;border:0;font:800 16px inherit;font-family:inherit}
.sheet{background:var(--card);border-radius:28px 28px 0 0;width:min(430px,100%);max-height:88vh;overflow:auto;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .4s cubic-bezier(.2,.9,.3,1) both;color:var(--ink)}
@keyframes up{from{transform:translateY(100%)}}
.ov.s{place-items:end center;padding:0}
.stage{background:linear-gradient(180deg,var(--glow),transparent);border-radius:20px;margin:10px 0}
.fig path{fill:none;stroke:var(--ink);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.fig circle.h{fill:var(--ink)}
.mc{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:20px;margin-bottom:10px;background:var(--card);cursor:pointer;animation:pop .4s both}
.fig-s{width:92px;flex:none;background:var(--glow);border-radius:14px}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--glow);color:var(--a);display:inline-block}
.set{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--ink);font:800 15px inherit;font-family:inherit;cursor:pointer;transition:all .3s}
.set.on{background:var(--a);border-color:var(--a);color:#fff;transform:scale(1.12) rotate(360deg)}
input.nm{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:12px;font:700 15px inherit;font-family:inherit;flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:30px;font-weight:700;font-size:14px;z-index:30;animation:pop .3s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
