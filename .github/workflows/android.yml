name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write app config
        env:
          YVP: ${{ secrets.YVP_APP_KEY }}
          SURL: ${{ secrets.WORKER_URL }}
          SKEY: ${{ secrets.APP_SECRET }}
        run: echo "window.YVP_KEY='$YVP';window.SCAN_URL='$SURL';window.SCAN_KEY='$SKEY';" > www/config.js

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Make app icon
        run: |
          pip install pillow
          python tools/make_icons.py

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Temple-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
